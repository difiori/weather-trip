<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget de Clima</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .weather-widget {
      padding: 20px;
      text-align: center;
      max-width: 800px;
      width: 100%;
    }

    .tabs {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab {
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
      border-bottom: 2px solid transparent;
    }

    .tab.active {
      border-bottom: 2px solid #000;
    }

    .city-weather {
      display: none;
    }

    .city-weather.active {
      display: block;
    }

    .city-weather h2 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
      color: #444;
    }

    .current-weather {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px 0;
      font-size: 2rem;
    }

    .current-weather img {
      width: 50px;
      height: 50px;
    }

    .forecast {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      gap: 8px;
    }

    .forecast .day {
      text-align: center;
      font-size: 0.9rem;
      flex: 1;
    }

    .forecast .day img {
      width: 40px;
      height: 40px;
      margin-bottom: 5px;
    }

    .forecast .day span {
      display: block;
      color: #444;
    }
  </style>
</head>

    </div>

    <div id="saopaulo" class="city-weather active">

        <span id="current-temp-saopaulo">--°C</span>
      </div>
      <div class="forecast" id="forecast-saopaulo"></div>
    </div>

    <div id="madrid" class="city-weather">

        <span id="current-temp-london">--°C</span>
      </div>
      <div class="forecast" id="forecast-london"></div>
    </div>
  </div>
