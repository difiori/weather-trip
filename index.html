<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Widget de Clima</title>

  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #fff;
      color: #111;
    }

    .weather-widget {
      padding: 20px;
      text-align: center;
      max-width: 900px;
      width: 100%;
      box-sizing: border-box;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
      border-bottom: 2px solid transparent;
      user-select: none;
    }

    .tab.active {
      border-bottom: 2px solid #000;
    }

    .city-weather {
      display: none;
    }

    .city-weather.active {
      display: block;
    }

    .city-weather h2 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      color: #444;
      letter-spacing: 1px;
    }

    .current-weather {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 24px 0 32px;
    }

    .current-weather img {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }

    .current-desc {
      font-size: 1rem;
      color: #444;
      margin-top: 4px;
      text-transform: lowercase;
    }

    .current-temp {
      font-size: 3rem;
      line-height: 1;
      margin-top: 6px;
    }

    .forecast {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      margin-top: 20px;
    }

    .forecast .day {
      text-align: center;
      font-size: 0.95rem;
      min-width: 0;
    }

    .forecast .day img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      margin: 6px 0;
    }

    .forecast .day span {
      display: block;
      color: #444;
    }

    .error {
      color: #a00;
      font-size: 0.95rem;
      margin-top: 16px;
    }

    @media (max-width: 720px) {
      .forecast {
        grid-template-columns: repeat(2, 1fr);
      }

      .current-temp {
        font-size: 2.5rem;
      }
    }
  </style>
</head>

<body>
  <div class="weather-widget">
    <div class="tabs">
      <div class="tab active" data-city="valencia">Valencia</div>
      <div class="tab" data-city="madrid">Madrid</div>
      <div class="tab" data-city="saopaulo">São Paulo</div>
    </div>

    <div id="valencia" class="city-weather active">
      <h2>VALENCIA</h2>
      <div class="current-weather">
        <img id="current-icon-valencia" alt="" />
        <span id="current-desc-valencia" class="current-desc">carregando...</span>
        <span id="current-temp-valencia" class="current-temp">--°C</span>
      </div>
      <div class="forecast" id="forecast-valencia"></div>
      <div class="error" id="error-valencia"></div>
    </div>

    <div id="madrid" class="city-weather">
      <h2>MADRID</h2>
      <div class="current-weather">
        <img id="current-icon-madrid" alt="" />
        <span id="current-desc-madrid" class="current-desc">carregando...</span>
        <span id="current-temp-madrid" class="current-temp">--°C</span>
      </div>
      <div class="forecast" id="forecast-madrid"></div>
      <div class="error" id="error-madrid"></div>
    </div>

    <div id="saopaulo" class="city-weather">
      <h2>SÃO PAULO</h2>
      <div class="current-weather">
        <img id="current-icon-saopaulo" alt="" />
        <span id="current-desc-saopaulo" class="current-desc">carregando...</span>
        <span id="current-temp-saopaulo" class="current-temp">--°C</span>
      </div>
      <div class="forecast" id="forecast-saopaulo"></div>
      <div class="error" id="error-saopaulo"></div>
    </div>
  </div>

  <script>
    const apiKey = 'SUA_API_KEY_AQUI';

    const cities = [
      {
        id: 'valencia',
        label: 'Valencia',
        lat: 39.4699,
        lon: -0.3763
      },
      {
        id: 'madrid',
        label: 'Madrid',
        lat: 40.4168,
        lon: -3.7038
      },
      {
        id: 'saopaulo',
        label: 'São Paulo',
        lat: -23.5505,
        lon: -46.6333
      }
    ];

    function getIconUrl(iconCode) {
      return `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
    }

    function formatLocalDateFromTimestamp(timestamp, timezoneOffsetSeconds) {
      const date = new Date((timestamp + timezoneOffsetSeconds) * 1000);

      return date.toLocaleDateString('pt-BR', {
        weekday: 'long',
        timeZone: 'UTC'
      });
    }

    function getLocalDayKey(timestamp, timezoneOffsetSeconds) {
      const date = new Date((timestamp + timezoneOffsetSeconds) * 1000);

      return date.toISOString().slice(0, 10);
    }

    async function fetchWeatherData(city) {
      const currentUrl =
        `https://api.openweathermap.org/data/2.5/weather?lat=${city.lat}&lon=${city.lon}&units=metric&lang=pt_br&appid=${apiKey}`;

      const forecastUrl =
        `https://api.openweathermap.org/data/2.5/forecast?lat=${city.lat}&lon=${city.lon}&units=metric&lang=pt_br&appid=${apiKey}`;

      const errorEl = document.getElementById(`error-${city.id}`);
      errorEl.textContent = '';

      try {
        const [currentResponse, forecastResponse] = await Promise.all([
          fetch(currentUrl),
          fetch(forecastUrl)
        ]);

        if (!currentResponse.ok || !forecastResponse.ok) {
          throw new Error('Falha ao buscar dados da OpenWeather.');
        }

        const currentData = await currentResponse.json();
        const forecastData = await forecastResponse.json();

        renderCurrentWeather(city, currentData);
        renderForecast(city, forecastData);

      } catch (error) {
        console.error(`Erro ao buscar clima de ${city.label}:`, error);
        errorEl.textContent = 'Não foi possível carregar o clima agora.';
      }
    }

    function renderCurrentWeather(city, data) {
      const tempEl = document.getElementById(`current-temp-${city.id}`);
      const iconEl = document.getElementById(`current-icon-${city.id}`);
      const descEl = document.getElementById(`current-desc-${city.id}`);

      const weather = data.weather?.[0];

      tempEl.textContent = `${Math.round(data.main.temp)}°C`;
      descEl.textContent = weather?.description || '';

      iconEl.src = getIconUrl(weather.icon);
      iconEl.alt = weather?.description || '';
    }

    function renderForecast(city, data) {
      const forecastContainer = document.getElementById(`forecast-${city.id}`);
      const timezoneOffset = data.city.timezone;
      const groupedDays = {};

      data.list.forEach(item => {
        const dayKey = getLocalDayKey(item.dt, timezoneOffset);

        if (!groupedDays[dayKey]) {
          groupedDays[dayKey] = {
            timestamp: item.dt,
            tempsMax: [],
            tempsMin: [],
            items: []
          };
        }

        groupedDays[dayKey].tempsMax.push(item.main.temp_max);
        groupedDays[dayKey].tempsMin.push(item.main.temp_min);
        groupedDays[dayKey].items.push(item);
      });

      const days = Object.values(groupedDays).slice(0, 5);

      const html = days.map(day => {
        const tempMax = Math.round(Math.max(...day.tempsMax));
        const tempMin = Math.round(Math.min(...day.tempsMin));

        const noonItem =
          day.items.find(item => item.dt_txt.includes('12:00:00')) ||
          day.items[Math.floor(day.items.length / 2)];

        const weather = noonItem.weather[0];
        const dayName = formatLocalDateFromTimestamp(day.timestamp, timezoneOffset);

        return `
          <div class="day">
            <span>${dayName}</span>
            <img src="${getIconUrl(weather.icon)}" alt="${weather.description}" />
            <span>${weather.description}</span>
            <span>máx. ${tempMax}°C</span>
            <span>mín. ${tempMin}°C</span>
          </div>
        `;
      }).join('');

      forecastContainer.innerHTML = html;
    }

    function showCity(cityId) {
      document.querySelectorAll('.city-weather').forEach(city => {
        city.classList.remove('active');
      });

      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
      });

      document.getElementById(cityId).classList.add('active');
      document.querySelector(`.tab[data-city="${cityId}"]`).classList.add('active');
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        showCity(tab.dataset.city);
      });
    });

    cities.forEach(city => fetchWeatherData(city));

    setInterval(() => {
      cities.forEach(city => fetchWeatherData(city));
    }, 7200000);
  </script>
</body>
</html>
