<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Widget de Clima</title>

  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #fff;
    }

    .weather-widget {
      padding: 20px;
      text-align: center;
      max-width: 900px;
      width: 100%;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
      border-bottom: 3px solid transparent;
      font-size: 1.2rem;
    }

    .tab.active {
      border-bottom-color: #000;
    }

    .city-weather {
      display: none;
    }

    .city-weather.active {
      display: block;
    }

    h2 {
      margin: 0 0 20px;
      font-size: 2rem;
      color: #444;
    }

    .current-weather {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 35px;
    }

    .current-weather img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }

    .description {
      font-size: 1.4rem;
      color: #444;
      text-transform: capitalize;
    }

    .temperature {
      font-size: 3rem;
      line-height: 1.1;
    }

    .forecast {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .day {
      flex: 1;
      text-align: center;
      font-size: 0.95rem;
      color: #444;
    }

    .day img {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }

    .day span {
      display: block;
      margin: 2px 0;
    }

    .error {
      color: #c00;
      margin-top: 20px;
      font-size: 1rem;
    }

    @media (max-width: 700px) {
      .forecast {
        flex-direction: column;
      }

      .tab {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>
  <div class="weather-widget">
    <div class="tabs">
      <div class="tab active" onclick="showCity('valencia')">Valencia</div>
      <div class="tab" onclick="showCity('madrid')">Madrid</div>
      <div class="tab" onclick="showCity('saopaulo')">São Paulo</div>
    </div>

    <div id="valencia" class="city-weather active">
      <h2>VALENCIA</h2>
      <div class="current-weather">
        <img id="current-icon-valencia" src="" alt="" />
        <span id="current-desc-valencia" class="description">Carregando...</span>
        <span id="current-temp-valencia" class="temperature">--°C</span>
      </div>
      <div id="forecast-valencia" class="forecast"></div>
      <div id="error-valencia" class="error"></div>
    </div>

    <div id="madrid" class="city-weather">
      <h2>MADRID</h2>
      <div class="current-weather">
        <img id="current-icon-madrid" src="" alt="" />
        <span id="current-desc-madrid" class="description">Carregando...</span>
        <span id="current-temp-madrid" class="temperature">--°C</span>
      </div>
      <div id="forecast-madrid" class="forecast"></div>
      <div id="error-madrid" class="error"></div>
    </div>

    <div id="saopaulo" class="city-weather">
      <h2>SÃO PAULO</h2>
      <div class="current-weather">
        <img id="current-icon-saopaulo" src="" alt="" />
        <span id="current-desc-saopaulo" class="description">Carregando...</span>
        <span id="current-temp-saopaulo" class="temperature">--°C</span>
      </div>
      <div id="forecast-saopaulo" class="forecast"></div>
      <div id="error-saopaulo" class="error"></div>
    </div>
  </div>

  <script>
    const apiKey = 'fa7a51c82e7fc59d3ca889505f94dcd2';

    const cities = [
      {
        id: 'valencia',
        name: 'Valencia',
        country: 'ES',
        lat: 39.4699,
        lon: -0.3763
      },
      {
        id: 'madrid',
        name: 'Madrid',
        country: 'ES',
        lat: 40.4168,
        lon: -3.7038
      },
      {
        id: 'saopaulo',
        name: 'São Paulo',
        country: 'BR',
        lat: -23.5505,
        lon: -46.6333
      }
    ];

    function getIcon(iconCode) {
      return `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
    }

    async function fetchWeatherData(city) {
      const weatherUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${city.lat}&lon=${city.lon}&units=metric&lang=pt_br&appid=${apiKey}`;
      const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?lat=${city.lat}&lon=${city.lon}&units=metric&lang=pt_br&appid=${apiKey}`;

      try {
        const weatherResponse = await fetch(weatherUrl);
        const forecastResponse = await fetch(forecastUrl);

        if (!weatherResponse.ok || !forecastResponse.ok) {
          throw new Error('Erro na API');
        }

        const weatherData = await weatherResponse.json();
        const forecastData = await forecastResponse.json();

        showCurrentWeather(city, weatherData);
        showForecast(city, forecastData);

      } catch (error) {
        document.getElementById(`error-${city.id}`).textContent =
          'Não foi possível carregar o clima agora.';
        console.error(error);
      }
    }

    function showCurrentWeather(city, data) {
      const icon = data.weather[0].icon;
      const description = data.weather[0].description;
      const temp = Math.round(data.main.temp);

      document.getElementById(`current-icon-${city.id}`).src = getIcon(icon);
      document.getElementById(`current-icon-${city.id}`).alt = description;
      document.getElementById(`current-desc-${city.id}`).textContent = description;
      document.getElementById(`current-temp-${city.id}`).textContent = `${temp}°C`;
    }

    function showForecast(city, data) {
      const forecastContainer = document.getElementById(`forecast-${city.id}`);
      forecastContainer.innerHTML = '';

      const days = {};

      data.list.forEach(item => {
        const date = item.dt_txt.split(' ')[0];

        if (!days[date]) {
          days[date] = {
            temps: [],
            icons: [],
            descriptions: [],
            dayName: new Date(date + 'T12:00:00').toLocaleDateString('pt-BR', {
              weekday: 'long'
            })
          };
        }

        days[date].temps.push(item.main.temp);
        days[date].icons.push(item.weather[0].icon);
        days[date].descriptions.push(item.weather[0].description);
      });

      Object.keys(days).slice(0, 5).forEach(date => {
        const day = days[date];

        const min = Math.round(Math.min(...day.temps));
        const max = Math.round(Math.max(...day.temps));

        const middleIndex = Math.floor(day.icons.length / 2);
        const icon = day.icons[middleIndex];
        const description = day.descriptions[middleIndex];

        forecastContainer.innerHTML += `
          <div class="day">
            <span>${day.dayName}</span>
            <img src="${getIcon(icon)}" alt="${description}">
            <span>${description}</span>
            <span>máx. ${max}°C</span>
            <span>mín. ${min}°C</span>
          </div>
        `;
      });
    }

    function showCity(cityId) {
      document.querySelectorAll('.city-weather').forEach(city => {
        city.classList.remove('active');
      });

      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
      });

      document.getElementById(cityId).classList.add('active');

      const clickedTab = Array.from(document.querySelectorAll('.tab')).find(tab =>
        tab.getAttribute('onclick') === `showCity('${cityId}')`
      );

      if (clickedTab) {
        clickedTab.classList.add('active');
      }
    }

    cities.forEach(city => fetchWeatherData(city));

    setInterval(() => {
      cities.forEach(city => fetchWeatherData(city));
    }, 7200000);
  </script>
</body>
</html>
