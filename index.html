<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Widget de Clima</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      background: #fff;
      color: #37352F;
      overflow-x: hidden;
    }

    .weather-widget {
      width: 100%;
      max-width: 760px;
      padding: 14px 18px 18px;
      text-align: center;
    }

    .tabs {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 6px 2px 8px;
      cursor: pointer;
      font-weight: 700;
      border-bottom: 3px solid transparent;
      font-size: 0.95rem;
      line-height: 1;
      white-space: nowrap;
    }

    .tab.active {
      border-bottom-color: #000;
    }

    .city-weather {
      display: none;
    }

    .city-weather.active {
      display: block;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 1.45rem;
      line-height: 1;
      color: #444;
      letter-spacing: -0.03em;
    }

    .current-weather {
      display: grid;
      grid-template-columns: auto auto;
      justify-content: center;
      align-items: center;
      gap: 10px 18px;
      margin-bottom: 18px;
    }

    .current-weather img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      grid-row: span 2;
    }

    .description {
      font-size: 1rem;
      color: #444;
      text-transform: capitalize;
      text-align: left;
      line-height: 1.1;
    }

    .temperature {
      font-size: 2.35rem;
      line-height: 1;
      font-weight: 500;
      text-align: left;
      letter-spacing: -0.08em;
    }

    .forecast {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
    }

    .day {
      min-width: 0;
      padding: 8px 6px;
      text-align: center;
      font-size: 0.75rem;
      line-height: 1.15;
      color: #444;
      border: 1px solid #eeeeee;
      border-radius: 10px;
      background: #fafafa;
    }

    .day img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      margin: 2px auto;
    }

    .day span {
      display: block;
      margin: 2px 0;
    }

    .day-name {
      font-weight: 700;
      text-transform: capitalize;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .day-desc {
      min-height: 26px;
      display: -webkit-box !important;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-transform: capitalize;
    }

    .temp-line {
      font-weight: 700;
      font-size: 0.78rem;
    }

    .error {
      color: #c00;
      margin-top: 12px;
      font-size: 0.85rem;
    }

    @media (max-width: 700px) {
      .weather-widget {
        padding: 12px;
      }

      .tabs {
        gap: 14px;
        margin-bottom: 16px;
      }

      .tab {
        font-size: 0.85rem;
      }

      h2 {
        font-size: 1.25rem;
      }

      .temperature {
        font-size: 2rem;
      }

      .forecast {
        grid-template-columns: repeat(5, minmax(72px, 1fr));
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .day {
        min-width: 72px;
      }
    }
  </style>
</head>

<body>
  <div class="weather-widget">
    <div class="tabs">
      <div class="tab active" onclick="showCity('roma')">Roma</div>
      <div class="tab" onclick="showCity('firenze')">Firenze</div>
      <div class="tab" onclick="showCity('pisa')">Pisa</div>
      <div class="tab" onclick="showCity('saopaulo')">São Paulo</div>
    </div>

    <div id="roma" class="city-weather active">
      <h2>ROMA</h2>
      <div class="current-weather">
        <img id="current-icon-roma" src="" alt="" />
        <span id="current-desc-roma" class="description">Carregando...</span>
        <span id="current-temp-roma" class="temperature">--°C</span>
      </div>
      <div id="forecast-roma" class="forecast"></div>
      <div id="error-roma" class="error"></div>
    </div>

    <div id="firenze" class="city-weather">
      <h2>FIRENZE</h2>
      <div class="current-weather">
        <img id="current-icon-firenze" src="" alt="" />
        <span id="current-desc-firenze" class="description">Carregando...</span>
        <span id="current-temp-firenze" class="temperature">--°C</span>
      </div>
      <div id="forecast-firenze" class="forecast"></div>
      <div id="error-firenze" class="error"></div>
    </div>

    <div id="pisa" class="city-weather">
      <h2>PISA</h2>
      <div class="current-weather">
        <img id="current-icon-pisa" src="" alt="" />
        <span id="current-desc-pisa" class="description">Carregando...</span>
        <span id="current-temp-pisa" class="temperature">--°C</span>
      </div>
      <div id="forecast-pisa" class="forecast"></div>
      <div id="error-pisa" class="error"></div>
    </div>

    <div id="saopaulo" class="city-weather">
      <h2>SÃO PAULO</h2>
      <div class="current-weather">
        <img id="current-icon-saopaulo" src="" alt="" />
        <span id="current-desc-saopaulo" class="description">Carregando...</span>
        <span id="current-temp-saopaulo" class="temperature">--°C</span>
      </div>
      <div id="forecast-saopaulo" class="forecast"></div>
      <div id="error-saopaulo" class="error"></div>
    </div>
  </div>

  <script>
    const apiKey = 'fa7a51c82e7fc59d3ca889505f94dcd2';

    const cities = [
      {
        id: 'roma',
        name: 'Roma',
        country: 'IT',
        lat: 41.9028,
        lon: 12.4964
      },
      {
        id: 'firenze',
        name: 'Firenze',
        country: 'IT',
        lat: 43.7696,
        lon: 11.2558
      },
      {
        id: 'pisa',
        name: 'Pisa',
        country: 'IT',
        lat: 43.7228,
        lon: 10.4017
      },
      {
        id: 'saopaulo',
        name: 'São Paulo',
        country: 'BR',
        lat: -23.5505,
        lon: -46.6333
      }
    ];

    function getIcon(iconCode) {
      return `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
    }

    async function fetchWeatherData(city) {
      const weatherUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${city.lat}&lon=${city.lon}&units=metric&lang=pt_br&appid=${apiKey}`;
      const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?lat=${city.lat}&lon=${city.lon}&units=metric&lang=pt_br&appid=${apiKey}`;

      try {
        const weatherResponse = await fetch(weatherUrl);
        const forecastResponse = await fetch(forecastUrl);

        if (!weatherResponse.ok || !forecastResponse.ok) {
          throw new Error('Erro na API');
        }

        const weatherData = await weatherResponse.json();
        const forecastData = await forecastResponse.json();

        showCurrentWeather(city, weatherData);
        showForecast(city, forecastData);

      } catch (error) {
        document.getElementById(`error-${city.id}`).textContent =
          'Não foi possível carregar o clima agora.';
        console.error(error);
      }
    }

    function showCurrentWeather(city, data) {
      const icon = data.weather[0].icon;
      const description = data.weather[0].description;
      const temp = Math.round(data.main.temp);

      document.getElementById(`current-icon-${city.id}`).src = getIcon(icon);
      document.getElementById(`current-icon-${city.id}`).alt = description;
      document.getElementById(`current-desc-${city.id}`).textContent = description;
      document.getElementById(`current-temp-${city.id}`).textContent = `${temp}°C`;
    }

    function showForecast(city, data) {
      const forecastContainer = document.getElementById(`forecast-${city.id}`);
      forecastContainer.innerHTML = '';

      const days = {};

      data.list.forEach(item => {
        const date = item.dt_txt.split(' ')[0];

        if (!days[date]) {
          days[date] = {
            temps: [],
            icons: [],
            descriptions: [],
            dayName: new Date(date + 'T12:00:00').toLocaleDateString('pt-BR', {
              weekday: 'short'
            }).replace('.', '')
          };
        }

        days[date].temps.push(item.main.temp);
        days[date].icons.push(item.weather[0].icon);
        days[date].descriptions.push(item.weather[0].description);
      });

      Object.keys(days).slice(0, 5).forEach(date => {
        const day = days[date];

        const min = Math.round(Math.min(...day.temps));
        const max = Math.round(Math.max(...day.temps));

        const middleIndex = Math.floor(day.icons.length / 2);
        const icon = day.icons[middleIndex];
        const description = day.descriptions[middleIndex];

        forecastContainer.innerHTML += `
          <div class="day">
            <span class="day-name">${day.dayName}</span>
            <img src="${getIcon(icon)}" alt="${description}">
            <span class="day-desc">${description}</span>
            <span class="temp-line">${min}° / ${max}°</span>
          </div>
        `;
      });
    }

    function showCity(cityId) {
      document.querySelectorAll('.city-weather').forEach(city => {
        city.classList.remove('active');
      });

      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
      });

      document.getElementById(cityId).classList.add('active');

      const clickedTab = Array.from(document.querySelectorAll('.tab')).find(tab =>
        tab.getAttribute('onclick') === `showCity('${cityId}')`
      );

      if (clickedTab) {
        clickedTab.classList.add('active');
      }
    }

    cities.forEach(city => fetchWeatherData(city));

    setInterval(() => {
      cities.forEach(city => fetchWeatherData(city));
    }, 7200000);
  </script>
</body>
</html>
