<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Widget de Clima</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      font-size: 18px;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      background: #ffffff;
      color: #37352F;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .weather-widget {
      width: 100%;
      max-width: none;
      padding: 20px 28px 22px;
      text-align: center;
    }

    .tabs {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 32px;
      margin-bottom: 26px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 5px 0 8px;
      cursor: pointer;
      font-weight: 700;
      border-bottom: 3px solid transparent;
      font-size: 1rem;
      line-height: 1;
      white-space: nowrap;
    }

    .tab.active {
      border-bottom-color: #000;
    }

    .city-weather {
      display: none;
    }

    .city-weather.active {
      display: block;
    }

    .current-weather {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      justify-content: center;
      column-gap: 18px;
      margin-bottom: 24px;
    }

    .city-info {
      text-align: right;
      min-width: 0;
    }

    .city-title {
      margin: 0 0 6px;
      font-size: 1.75rem;
      line-height: 1;
      color: #444;
      letter-spacing: -0.04em;
      font-weight: 800;
    }

    .description {
      display: block;
      font-size: 1rem;
      color: #666;
      text-transform: capitalize;
      line-height: 1.1;
    }

    .weather-icon {
      width: 62px;
      height: 62px;
      object-fit: contain;
      display: block;
    }

    .temperature {
      text-align: left;
      font-size: 2.9rem;
      line-height: 1;
      font-weight: 500;
      letter-spacing: -0.08em;
      color: #37352F;
    }

    .forecast {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      column-gap: 22px;
      row-gap: 8px;
      width: 100%;
      padding-top: 14px;
      border-top: 1px solid #eeeeee;
    }

    .day {
      min-width: 0;
      text-align: center;
      font-size: 0.82rem;
      line-height: 1.15;
      color: #444;
    }

    .day-name {
      display: block;
      font-weight: 800;
      text-transform: capitalize;
      margin-bottom: 5px;
    }

    .day img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      margin: 0 auto 4px;
      display: block;
    }

    .day-desc {
      min-height: 30px;
      color: #666;
      text-transform: capitalize;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      margin-bottom: 5px;
    }

    .temp-line {
      display: block;
      font-size: 0.88rem;
      font-weight: 800;
      color: #37352F;
      letter-spacing: 0.02em;
    }

    .error {
      color: #c00;
      margin-top: 12px;
      font-size: 0.9rem;
    }

    @media (max-width: 700px) {
      html {
        font-size: 16px;
      }

      .weather-widget {
        padding: 16px 16px 18px;
      }

      .tabs {
        gap: 18px;
        margin-bottom: 20px;
      }

      .tab {
        font-size: 0.88rem;
      }

      .current-weather {
        column-gap: 12px;
        margin-bottom: 20px;
      }

      .city-title {
        font-size: 1.35rem;
      }

      .description {
        font-size: 0.84rem;
      }

      .weather-icon {
        width: 48px;
        height: 48px;
      }

      .temperature {
        font-size: 2.2rem;
      }

      .forecast {
        grid-template-columns: repeat(5, minmax(72px, 1fr));
        column-gap: 12px;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .day {
        min-width: 72px;
        font-size: 0.72rem;
      }

      .day img {
        width: 28px;
        height: 28px;
      }

      .temp-line {
        font-size: 0.78rem;
      }
    }

    @media (max-width: 430px) {
      html {
        font-size: 15px;
      }

      .weather-widget {
        padding: 14px 12px 16px;
      }

      .tabs {
        gap: 14px;
      }

      .tab {
        font-size: 0.8rem;
      }

      .city-title {
        font-size: 1.18rem;
      }

      .weather-icon {
        width: 42px;
        height: 42px;
      }

      .temperature {
        font-size: 1.9rem;
      }
    }
  </style>
</head>

<body>
  <div class="weather-widget">

    <div class="tabs">
      <div class="tab active" onclick="showCity('saopaulo')">São Paulo</div>
      <div class="tab" onclick="showCity('madrid')">Madrid</div>
      <div class="tab" onclick="showCity('valencia')">Valencia</div>
      <div class="tab" onclick="showCity('barcelona')">Barcelona</div>
    </div>

    <!-- SÃO PAULO -->
    <div id="saopaulo" class="city-weather active">
      <div class="current-weather">
        <div class="city-info">
          <h2 class="city-title">SÃO PAULO</h2>
          <span id="current-desc-saopaulo" class="description">
            Carregando...
          </span>
        </div>

        <img
          id="current-icon-saopaulo"
          class="weather-icon"
          src=""
          alt=""
        />

        <div id="current-temp-saopaulo" class="temperature">
          --°C
        </div>
      </div>

      <div id="forecast-saopaulo" class="forecast"></div>
      <div id="error-saopaulo" class="error"></div>
    </div>


    <!-- MADRID -->
    <div id="madrid" class="city-weather">
      <div class="current-weather">
        <div class="city-info">
          <h2 class="city-title">MADRID</h2>
          <span id="current-desc-madrid" class="description">
            Carregando...
          </span>
        </div>

        <img
          id="current-icon-madrid"
          class="weather-icon"
          src=""
          alt=""
        />

        <div id="current-temp-madrid" class="temperature">
          --°C
        </div>
      </div>

      <div id="forecast-madrid" class="forecast"></div>
      <div id="error-madrid" class="error"></div>
    </div>


    <!-- VALENCIA -->
    <div id="valencia" class="city-weather">
      <div class="current-weather">
        <div class="city-info">
          <h2 class="city-title">VALENCIA</h2>
          <span id="current-desc-valencia" class="description">
            Carregando...
          </span>
        </div>

        <img
          id="current-icon-valencia"
          class="weather-icon"
          src=""
          alt=""
        />

        <div id="current-temp-valencia" class="temperature">
          --°C
        </div>
      </div>

      <div id="forecast-valencia" class="forecast"></div>
      <div id="error-valencia" class="error"></div>
    </div>


    <!-- BARCELONA -->
    <div id="barcelona" class="city-weather">
      <div class="current-weather">
        <div class="city-info">
          <h2 class="city-title">BARCELONA</h2>
          <span id="current-desc-barcelona" class="description">
            Carregando...
          </span>
        </div>

        <img
          id="current-icon-barcelona"
          class="weather-icon"
          src=""
          alt=""
        />

        <div id="current-temp-barcelona" class="temperature">
          --°C
        </div>
      </div>

      <div id="forecast-barcelona" class="forecast"></div>
      <div id="error-barcelona" class="error"></div>
    </div>

  </div>

  <script>
    const apiKey = 'fa7a51c82e7fc59d3ca889505f94dcd2';

    const cities = [
      {
        id: 'saopaulo',
        name: 'São Paulo',
        country: 'BR',

        // Aeroporto Internacional de Guarulhos (GRU)
        lat: -23.4356,
        lon: -46.4731
      },

      {
        id: 'madrid',
        name: 'Madrid',
        country: 'ES',
        lat: 40.4168,
        lon: -3.7038
      },

      {
        id: 'valencia',
        name: 'Valencia',
        country: 'ES',
        lat: 39.4699,
        lon: -0.3763
      },

      {
        id: 'barcelona',
        name: 'Barcelona',
        country: 'ES',
        lat: 41.3874,
        lon: 2.1686
      }
    ];


    function getIcon(iconCode) {
      return `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
    }


    function capitalizeText(text) {
      if (!text) return '';

      return text.charAt(0).toUpperCase() + text.slice(1);
    }


    async function fetchWeatherData(city) {

      const weatherUrl =
        `https://api.openweathermap.org/data/2.5/weather` +
        `?lat=${city.lat}` +
        `&lon=${city.lon}` +
        `&units=metric` +
        `&lang=pt_br` +
        `&appid=${apiKey}`;

      const forecastUrl =
        `https://api.openweathermap.org/data/2.5/forecast` +
        `?lat=${city.lat}` +
        `&lon=${city.lon}` +
        `&units=metric` +
        `&lang=pt_br` +
        `&appid=${apiKey}`;

      try {

        const [weatherResponse, forecastResponse] =
          await Promise.all([
            fetch(weatherUrl),
            fetch(forecastUrl)
          ]);

        if (!weatherResponse.ok || !forecastResponse.ok) {
          throw new Error('Erro na API');
        }

        const [weatherData, forecastData] =
          await Promise.all([
            weatherResponse.json(),
            forecastResponse.json()
          ]);

        showCurrentWeather(city, weatherData);
        showForecast(city, forecastData);

      } catch (error) {

        document.getElementById(
          `error-${city.id}`
        ).textContent =
          'Não foi possível carregar o clima agora.';

        console.error(error);
      }
    }


    function showCurrentWeather(city, data) {

      const icon = data.weather[0].icon;
      const description =
        capitalizeText(data.weather[0].description);

      const temp = Math.round(data.main.temp);

      const iconElement =
        document.getElementById(
          `current-icon-${city.id}`
        );

      iconElement.src = getIcon(icon);
      iconElement.alt = description;

      document.getElementById(
        `current-desc-${city.id}`
      ).textContent = description;

      document.getElementById(
        `current-temp-${city.id}`
      ).textContent = `${temp}°C`;
    }


    function showForecast(city, data) {

      const forecastContainer =
        document.getElementById(
          `forecast-${city.id}`
        );

      forecastContainer.innerHTML = '';

      const days = {};

      data.list.forEach(item => {

        const date =
          item.dt_txt.split(' ')[0];

        if (!days[date]) {

          days[date] = {
            temps: [],
            icons: [],
            descriptions: [],

            dayName:
              new Date(
                date + 'T12:00:00'
              )
              .toLocaleDateString(
                'pt-BR',
                {
                  weekday: 'short'
                }
              )
              .replace('.', '')
          };
        }

        days[date].temps.push(
          item.main.temp
        );

        days[date].icons.push(
          item.weather[0].icon
        );

        days[date].descriptions.push(
          item.weather[0].description
        );
      });


      Object.keys(days)
        .slice(0, 5)
        .forEach(date => {

          const day = days[date];

          const min =
            Math.round(
              Math.min(...day.temps)
            );

          const max =
            Math.round(
              Math.max(...day.temps)
            );

          const middleIndex =
            Math.floor(
              day.icons.length / 2
            );

          const icon =
            day.icons[middleIndex];

          const description =
            capitalizeText(
              day.descriptions[middleIndex]
            );

          forecastContainer.innerHTML += `
            <div class="day">

              <span class="day-name">
                ${capitalizeText(day.dayName)}
              </span>

              <img
                src="${getIcon(icon)}"
                alt="${description}"
              >

              <span class="day-desc">
                ${description}
              </span>

              <span class="temp-line">
                ${min}° / ${max}°
              </span>

            </div>
          `;
        });
    }


    function showCity(cityId) {

      document
        .querySelectorAll('.city-weather')
        .forEach(city => {
          city.classList.remove('active');
        });

      document
        .querySelectorAll('.tab')
        .forEach(tab => {
          tab.classList.remove('active');
        });

      document
        .getElementById(cityId)
        .classList.add('active');

      const clickedTab =
        Array.from(
          document.querySelectorAll('.tab')
        )
        .find(tab =>
          tab.getAttribute('onclick') ===
          `showCity('${cityId}')`
        );

      if (clickedTab) {
        clickedTab.classList.add('active');
      }
    }


    // Carregamento inicial
    cities.forEach(
      city => fetchWeatherData(city)
    );


    // Atualiza a cada 2 horas
    setInterval(() => {

      cities.forEach(
        city => fetchWeatherData(city)
      );

    }, 7200000);
  </script>
</body>
</html>
